services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    env_file: .env
    restart: unless-stopped
    environment:
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"

  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    volumes:
      - ./data:/app/data
      - /tmp/m3u8-saver:/tmp/m3u8-saver
    # For NVIDIA later, install NVIDIA Container Toolkit on the host and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    # For Intel/AMD VAAPI later, pass the render device:
    # devices:
    #   - /dev/dri:/dev/dri
