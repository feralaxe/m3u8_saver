services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /tmp/m3u8-saver:/tmp/m3u8-saver
    # For NVIDIA later, install NVIDIA Container Toolkit on the host and uncomment:
